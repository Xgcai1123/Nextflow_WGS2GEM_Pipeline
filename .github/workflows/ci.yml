# ============================================================
# CI -- regression guards for the pipeline itself.
#
# What runs here is exactly what a developer runs locally: this workflow only
# installs Nextflow and calls tests/ci/*.sh, so the two cannot drift apart
# (see tests/ci/README.md).
#
# No conda environment is built and no real tool is executed: the smoke checks
# use `-stub-run` with conda disabled (tests/ci/ci.config), because all ten
# processes carry a `stub:` block, and the embedding check runs the two
# report-embedder scripts directly. The growth job is the one exception to
# "tool-free": it needs `cobra` (pip-installed) to run flux balance analysis on a
# synthetic model, because the real models are generated artefacts and are not in
# the repository. The whole job set finishes in about a minute per job. The full
# 10-step run against real data stays a manual, documented acceptance test
# (docs/nextflow-port-design.md §14).
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single place to bump Nextflow. Two constraints are coupled to this value:
  #   - manifest.nextflowVersion in nextflow.config (>= 25.10.0)
  #   - LINT_WARNING_BASELINE in tests/ci/run-lint.sh (warning counts are
  #     version-specific; re-record it when bumping)
  NEXTFLOW_VERSION: '26.10.0'
  NXF_ANSI_LOG: 'false'

jobs:
  lint:
    name: nextflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NEXTFLOW_VERSION }}
          java-version: '21'
      - name: Lint (no errors, no new warnings)
        run: bash tests/ci/run-lint.sh

  smoke:
    name: compile + validation + DAG smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NEXTFLOW_VERSION }}
          java-version: '21'
      - name: Embedding scripts (MEMOTE / QUAST sections -- no conda, no Nextflow)
        run: bash tests/ci/run-embed-check.sh
      - name: Sample-sheet validation (preview + injected bad sheets)
        run: bash tests/ci/run-preview.sh
      - name: Disk pre-flight guard (F20)
        run: bash tests/ci/run-disk-guard.sh
      - name: Full 10-step DAG with stubs + output contract
        run: bash tests/ci/run-stub-smoke.sh

  cleanup-tool:
    name: cleanup tool blast radius
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No Nextflow, no conda, no python: bin/pipeline-clean is bash + coreutils,
      # and the check runs it against a fixture project of sentinel files. A
      # cleanup tool is the one script here that can destroy the evidence, so its
      # blast radius is asserted on both sides -- what goes, and what survives.
      - name: Three levels, two refusals, one negative control
        run: bash tests/ci/run-clean-check.sh

  failure-isolation:
    name: injected single-sample failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NEXTFLOW_VERSION }}
          java-version: '21'
      - name: Inject a failing sample; verify loud failure + -resume convergence
        run: bash tests/ci/run-failure-isolation.sh

  local-ui:
    name: local web UI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NEXTFLOW_VERSION }}
          java-version: '21'
      # The contract assertions are driven by a programmable fake engine
      # (tests/ci/fixtures/ui/fake-nextflow); the stub-DAG leg needs the real
      # Nextflow but still no conda, no tools and no output tree.
      - name: Run the UI against the fake engine and the stub DAG
        run: bash tests/ci/run-ui-check.sh

  growth-validation:
    name: defined-medium growth check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # No Nextflow and no conda: the checker needs cobra (which brings its own
      # GLPK solver, swiglpk) plus PyYAML for the medium definition -- cobra does
      # NOT depend on PyYAML, which is why the first real CI run of this job
      # failed with an import error rather than a check failure.
      - name: Install cobra + PyYAML
        run: pip install cobra pyyaml
      - name: Defined-medium growth check + its negative controls (F25)
        run: bash tests/ci/run-growth-check.sh
