# =============================================================================
# MultiQC configuration overlay for the Nextflow port
# =============================================================================
# This file is layered ON TOP of the reused `multiqc_config.yaml`
# (which stays byte-identical to the Snakemake original -- decision D4):
#
#   multiqc ... -c multiqc_config.yaml -c multiqc_nextflow.yaml
#
# It carries the four report-presentation requirements of the Nextflow port:
#
#   1) Report sections are ordered by PIPELINE step, not alphabetically:
#      FastQC -> QUAST -> BUSCO -> CarveMe -> MEMOTE -> runtimes -> versions.
#      Anchor names are the *section ids* MultiQC renders (verified on 1.21:
#      `report_section_order` is a single flat level here -- the custom-content
#      sections appear as top-level entries, NOT under a `custom_content` key).
#      Semantics: a HIGHER `order` value places the section EARLIER.
#
#   2) The full MEMOTE snapshot HTML (one ~4 MB self-contained Angular page per
#      sample) is embedded into the report as its own section, produced by
#      scripts/memote_html_section.py into `memote_full_<sample>_mqc.html`.
#      The `_mqc.html` suffix is MultiQC's built-in custom-content
#      auto-discovery convention, so NO `sp:` search pattern is needed here --
#      deliberately so: MultiQC REPLACES (does not deep-merge) the `sp` block
#      when several config files are layered, so a second `sp:` entry would
#      silently drop the patterns defined in multiqc_config.yaml.
#      Those sections keep their default order values, which land after the
#      MEMOTE score table (600) and before the runtimes table (-100).
#
#   3) QUAST's own output files are merged in too: `report.html` (the full
#      self-contained interactive report) and `report.txt` are embedded by
#      scripts/quast_html_section.py into a SINGLE `quast_full_mqc.html`.
#      One section for the whole cohort, not one per sample -- MultiQC matches
#      `report_section_order` anchors EXACTLY (no globs; multiqc 1.21
#      multiqc.py:895) and every `_mqc.html` with a unique `id:` becomes its own
#      top-level module, so per-sample anchors could never be placed next to the
#      QUAST tables. The fixed anchor below does that instead.
#
#   4) The growth check (F26) publishes its result as a `*_mqc.tsv` table whose
#      whole section config -- id, title, plot_type, column headers -- lives in
#      the FILE HEADER, which MultiQC's `_find_file_header()` parses from the
#      '#'-prefixed YAML. That is deliberate: declaring it here would need an
#      `sp:` entry, and a second `sp:` REPLACES (never merges) the block in the
#      reused multiqc_config.yaml, silently dropping every existing
#      custom-content section. Only its ordering anchor belongs here.
# -----------------------------------------------------------------------------

report_section_order:
  # --- pipeline order (higher = earlier) ---
  fastqc:                    { order: 1000 }   # step 1/3  FastQC (raw + trimmed)
  quast:                     { order: 900 }    # step 5    QUAST assembly QC table
  quast_full:                { order: 850 }    # step 5    QUAST full reports (embedded)
  busco:                     { order: 800 }    # step 6    BUSCO completeness
  carveme_summary:           { order: 700 }    # step 8    CarveMe draft model
  memote_summary:            { order: 600 }    # step 9    MEMOTE model quality
  growth_on_medium:          { order: 550 }    # step 10   growth on a defined medium (F26)
  pipeline_runtime:          { order: -100 }   # summary   per-step runtimes
  multiqc_software_versions: { order: -200 }   # always last

# -----------------------------------------------------------------------------
# General Statistics TABLE column order, also by pipeline step.
# MultiQC buckets general-stats columns by their `namespace` and sorts them by
# `placement` (ascending; the implicit default is 1000, so anything unset sinks
# to the right). Namespaces come from multiqc_config.yaml (`namespace:`) for the
# custom-content columns and from the built-in modules for FastQC/QUAST.
# -----------------------------------------------------------------------------
table_columns_placement:
  FastQC:                 # step 1/3  FastQC (raw + trimmed)
    percent_duplicates: 100
    percent_gc: 110
    avg_sequence_length: 120
    median_sequence_length: 130
    percent_fails: 140
    total_sequences: 150
  QUAST:                  # step 5    QUAST (built-in columns + custom extras)
    N50: 200
    "Total length": 210   # built-in QUAST key keeps its space (see quast.py)
    L50: 220
    contigs: 230
    gc_percent: 240
  CarveMe:                # step 8    CarveMe draft model size
    reactions: 300
    metabolites: 310
  MEMOTE:                 # step 9    MEMOTE total score (key keeps its space)
    "Total score": 400
